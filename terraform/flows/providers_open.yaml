inboundCall:
  name: "{{flow_name}}"
  description: Health professionals and providers line, business hours.
  division: "{{division_name}}"
  defaultLanguage: en-au
  startUpRef: ./menus/menu[mainMenu]
  initialGreeting:
    tts: Thank you for calling the health professionals line. This call may be recorded for quality and training.
  menus:
    - menu:
        name: Providers Menu
        audio:
          tts: For provider and professional enquiries, press 1. For help in another language, press 2. To make a complaint or give feedback, press 3.
        refId: mainMenu
        choices:
          - menuTransferToAcd:
              name: Provider enquiries
              dtmf: digit_1
              targetQueue:
                lit:
                  name: "{{queue_health_professionals}}"
          - menuTransferToAcd:
              name: Interpreter or relay
              dtmf: digit_2
              targetQueue:
                lit:
                  name: "{{queue_accessibility_and_interpreter}}"
          - menuTransferToAcd:
              name: Complaints and feedback
              dtmf: digit_3
              targetQueue:
                lit:
                  name: "{{queue_complaints_and_feedback}}"
