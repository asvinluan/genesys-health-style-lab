inboundCall:
  name: "{{flow_name}}"
  description: Providers line, outside hours. Message only.
  division: "{{division_name}}"
  defaultLanguage: en-au
  startUpRef: ./menus/menu[mainMenu]
  initialGreeting:
    tts: Thank you for calling the health professionals line. We are closed.
  menus:
    - menu:
        name: Closed Message
        audio:
          tts: We are open Monday to Friday, 8am to 6pm, Melbourne time. Provider information is on our website. Press 9 to end this call.
        refId: mainMenu
        choices:
          - menuDisconnect:
              name: Disconnect
              dtmf: digit_9
